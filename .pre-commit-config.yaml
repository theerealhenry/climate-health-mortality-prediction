# All hooks run against the conda env's already-installed, pyproject.toml-pinned
# tools (language: system) rather than pre-commit's own hosted-repo hook
# environments. This avoids a first-run network dependency on cloning
# ruff-pre-commit/black from GitHub (which can hang on slow/restricted
# connections) and keeps tool versions in exactly one place: pyproject.toml.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + fix)
        entry: ruff check --fix
        language: system
        types: [python]

      - id: black
        name: black (format)
        entry: black
        language: system
        types: [python]

      - id: nbstripout
        name: nbstripout (strip notebook outputs, except narrative notebooks)
        entry: nbstripout
        language: system
        files: \.ipynb$
        exclude: ^(notebooks/(00_data_forensics|01_eda|05_interpretability)\.ipynb|reference/.*\.ipynb)$
