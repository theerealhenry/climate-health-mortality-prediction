[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climate-health"
version = "0.1.0"
description = "Climate-Sensitive Mortality Prediction — competition + portfolio pipeline"
requires-python = ">=3.11,<3.12"
readme = "README.md"

# --- core: always needed, everything else builds on this ---
dependencies = [
    "numpy>=1.26,<2.2",          # capped below 2.2: SHAP/numba have a confirmed break above this
    "pandas>=2.2,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.5,<2",
    "pandera>=0.20,<1",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
# gradient boosting model zoo + tuning + interpretability
ml = [
    "lightgbm>=4.5,<5",
    "xgboost>=2.1,<3",
    "catboost>=1.2.7,<2",        # verified: 1.2.10 is latest, ships wheels through Python 3.14
    "optuna>=3.6,<5",
    "shap>=0.46,<1",
]

# experiment tracking
tracking = [
    "mlflow>=3.0,<4",            # verified: 3.8.1 latest; 3.x line targets pydantic 2
]

# API + demo UI (Phase 7, but installed now per your request)
serving = [
    "pydantic>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.38,<2",
]

# dev tooling
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "black>=24.0,<25",
    "pre-commit>=3.7,<4",
    "nbstripout>=0.7,<1",
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<7",
]

# convenience: install everything at once
all = [
    "climate-health[ml,tracking,serving,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/climate_health"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
